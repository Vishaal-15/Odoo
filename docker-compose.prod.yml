# ==============================================================================
# Dayflow HRMS - Production Docker Compose Architecture
# Developer 3: Database + Infrastructure
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Production PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres_prod:
    image: postgres:16-alpine
    container_name: dayflow_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-dayflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      # In production, bind only to localhost or keep internal to docker network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/backups:/backups
    shm_size: 256mb
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dayflow_user} -d ${POSTGRES_DB:-dayflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dayflow_prod_network

volumes:
  postgres_prod_data:
    name: dayflow_postgres_prod_data

networks:
  dayflow_prod_network:
    name: dayflow_prod_network
    driver: bridge
