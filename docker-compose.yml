services:
  # ============================================================================
  # PostgreSQL Database Service (Developer 3)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: dayflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-dayflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayflow_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dayflow_user} -d ${POSTGRES_DB:-dayflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dayflow_network

  # ============================================================================
  # Optional Database Management UI (Adminer - Lightweight Web UI)
  # Access at http://localhost:8080 (System: PostgreSQL, Server: postgres)
  # ============================================================================
  adminer:
    image: adminer:latest
    container_name: dayflow_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dayflow_network
    profiles:
      - tools

volumes:
  postgres_data:
    name: dayflow_postgres_data

networks:
  dayflow_network:
    name: dayflow_network
    driver: bridge
