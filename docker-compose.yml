services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: dayflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-dayflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayflow_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dayflow_user} -d ${POSTGRES_DB:-dayflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dayflow_network

  # ============================================================================
  # FastAPI Backend
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dayflow_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dayflow_user}:${POSTGRES_PASSWORD:-dayflow_password}@postgres:5432/${POSTGRES_DB:-dayflow_db}
      SECRET_KEY: ${SECRET_KEY:-dayflow_insecure_dev_secret_key_change_in_production_987654321}
      ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dayflow_network

  # ============================================================================
  # React Frontend (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: dayflow_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - dayflow_network

  # ============================================================================
  # Optional Database Management UI (Adminer)
  # Access at http://localhost:8080
  # ============================================================================
  adminer:
    image: adminer:latest
    container_name: dayflow_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dayflow_network
    profiles:
      - tools

volumes:
  postgres_data:
    name: dayflow_postgres_data

networks:
  dayflow_network:
    name: dayflow_network
    driver: bridge
